<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Animal Sentences</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom playful font and animations */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 20%, transparent 20%), radial-gradient(#bae6fd 20%, transparent 20%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            user-select: none; /* Prevent accidental text selection on smart boards */
        }

        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-hover-effect {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        .btn-hover-effect:active {
            transform: scale(0.95);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .emoji-shadow {
            filter: drop-shadow(0px 10px 8px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center">

    <!-- Start Screen -->
    <div id="start-screen" class="flex flex-col items-center justify-center h-full w-full absolute z-50 bg-white/90 backdrop-blur-sm transition-opacity duration-500">
        <h1 class="text-6xl md:text-8xl font-black text-sky-500 mb-8 drop-shadow-lg text-center leading-tight">
            English<br>Animals Game!
        </h1>
        <div class="flex gap-4 text-6xl mb-12 emoji-shadow">
            🐘 🐎 🐦 🦆 🐢 🦊
        </div>
        <button onclick="startGame()" class="btn-hover-effect bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-5xl md:text-6xl font-black py-8 px-16 rounded-[3rem] shadow-[0_10px_0_0_#ca8a04] border-4 border-yellow-500">
            START 🚀
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden flex-col items-center justify-between h-full w-full p-6 md:p-12 max-w-7xl mx-auto relative">
        
        <!-- Header (Score and Timer) -->
        <div class="w-full flex justify-between items-center mb-4">
            <div class="bg-white/80 px-6 md:px-8 py-3 md:py-4 rounded-3xl shadow-md border-4 border-sky-200 transition-transform duration-300">
                <h2 class="text-3xl md:text-4xl font-black text-sky-600">Score: <span id="score-display">0</span> 🌟</h2>
            </div>
            <div class="bg-white/80 px-6 md:px-8 py-3 md:py-4 rounded-3xl shadow-md border-4 border-orange-200 transition-colors duration-300">
                <h2 class="text-3xl md:text-4xl font-black text-orange-600">Time: <span id="time-display">30</span> ⏱️</h2>
            </div>
        </div>

        <!-- Emoji Display Area -->
        <div class="flex-1 flex flex-col items-center justify-center w-full">
            <div id="emoji-container" class="text-[12rem] md:text-[18rem] leading-none mb-8 emoji-shadow pop-in">
                <!-- Emoji will be injected here -->
            </div>
            
            <!-- Feedback Message -->
            <div id="feedback-msg" class="h-20 flex items-center justify-center">
                <p id="feedback-text" class="text-4xl md:text-5xl font-black opacity-0 transition-opacity duration-300"></p>
            </div>
        </div>

        <!-- Options Container -->
        <div id="options-container" class="w-full grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 mt-4">
            <!-- Buttons will be injected here -->
        </div>

    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden flex-col items-center justify-center h-full w-full absolute z-50 bg-white/95 backdrop-blur-sm transition-opacity duration-500">
        <h1 class="text-6xl md:text-8xl font-black text-rose-500 mb-4 drop-shadow-lg text-center leading-tight">
            Time's Up! ⏰
        </h1>
        <p class="text-4xl md:text-5xl font-bold text-sky-600 mb-12">
            Final Score: <span id="final-score" class="text-6xl text-yellow-500 drop-shadow-md">0</span> 🌟
        </p>
        <button onclick="resetToStart()" class="btn-hover-effect bg-sky-400 hover:bg-sky-500 text-white text-5xl md:text-6xl font-black py-8 px-16 rounded-[3rem] shadow-[0_10px_0_0_#0284c7] border-4 border-sky-500">
            Play Again ↺
        </button>
    </div>

    <script>
        // Audio Context for sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, now); // A5
                oscillator.frequency.exponentialRampToValueAtTime(1760, now + 0.1); // A6
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'wrong') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, now);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'tick') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, now);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'end') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.8);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
                oscillator.start(now);
                oscillator.stop(now + 1.0);
            }
        }

        // Game Data based on English Passport Week 8 & 9
        const animalData = [
            { emoji: '🐘', sentence: 'It is an elephant.' },
            { emoji: '🐎', sentence: 'It is a horse.' },
            { emoji: '🐦', sentence: 'It is a bird.' },
            { emoji: '🦆', sentence: 'It is a duck.' },
            { emoji: '🐢', sentence: 'It is a turtle.' },
            { emoji: '🦊', sentence: 'It is a fox.' }
        ];

        // State variables
        let score = 0;
        let currentCorrectAnswer = null;
        let isWaitingForNext = false; // Prevent clicking while feedback is showing
        let timeLeft = 30;
        let timerInterval = null;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const emojiContainer = document.getElementById('emoji-container');
        const optionsContainer = document.getElementById('options-container');
        const feedbackText = document.getElementById('feedback-text');

        // Start Game function
        function startGame() {
            // Resume audio context on first user interaction
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            startScreen.classList.add('opacity-0');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                gameScreen.classList.add('flex');
                score = 0;
                timeLeft = 30;
                updateScore();
                timeDisplay.textContent = timeLeft;
                generateQuestion();
                startTimer();
            }, 500); // Wait for fade out
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    timeDisplay.parentElement.classList.remove('border-orange-200', 'text-orange-600');
                    timeDisplay.parentElement.classList.add('border-rose-400', 'text-rose-600', 'animate-pulse');
                }

                if (timeLeft <= 3 && timeLeft > 0) {
                    playSound('tick'); // Play tick sound for last 3 seconds
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            playSound('end'); // Play end sound
            isWaitingForNext = true; // Stop interactions
            gameScreen.classList.remove('flex');
            gameScreen.classList.add('hidden');
            
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            endScreen.classList.remove('opacity-0');
            finalScoreDisplay.textContent = score;
        }

        function resetToStart() {
            endScreen.classList.add('hidden');
            endScreen.classList.remove('flex');
            startScreen.classList.remove('hidden');
            startScreen.classList.remove('opacity-0');
            
            // Reset timer styling
            timeDisplay.parentElement.classList.add('border-orange-200', 'text-orange-600');
            timeDisplay.parentElement.classList.remove('border-rose-400', 'text-rose-600', 'animate-pulse');
        }

        // Utility: Shuffle an array
        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Generate a new question
        function generateQuestion() {
            isWaitingForNext = false;
            
            // Clear feedback
            feedbackText.style.opacity = '0';
            
            // Re-trigger animation on emoji
            emojiContainer.classList.remove('pop-in');
            void emojiContainer.offsetWidth; // trigger reflow
            emojiContainer.classList.add('pop-in');

            // Pick a random correct animal
            const correctAnimal = animalData[Math.floor(Math.random() * animalData.length)];
            currentCorrectAnswer = correctAnimal;

            // Display Emoji
            emojiContainer.textContent = correctAnimal.emoji;

            // Pick 2 wrong answers
            let wrongOptions = animalData.filter(a => a.sentence !== correctAnimal.sentence);
            wrongOptions = shuffle(wrongOptions).slice(0, 2);

            // Combine and shuffle options
            let options = [correctAnimal, ...wrongOptions];
            options = shuffle(options);

            // Render buttons
            optionsContainer.innerHTML = '';
            
            // Vibrant colors for the buttons
            const buttonColors = [
                'bg-sky-400 border-sky-500 shadow-[0_8px_0_0_#0ea5e9]', 
                'bg-emerald-400 border-emerald-500 shadow-[0_8px_0_0_#10b981]', 
                'bg-violet-400 border-violet-500 shadow-[0_8px_0_0_#8b5cf6]'
            ];

            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-hover-effect ${buttonColors[index]} text-white text-3xl md:text-5xl font-bold py-8 px-6 rounded-3xl border-b-4 w-full h-full min-h-[140px] flex items-center justify-center text-center leading-tight`;
                btn.textContent = opt.sentence;
                btn.onclick = () => handleAnswer(opt.sentence, btn);
                
                // Add staggered entrance animation
                btn.style.opacity = '0';
                btn.style.animation = `popIn 0.3s ease ${index * 0.1}s forwards`;
                
                optionsContainer.appendChild(btn);
            });
        }

        // Handle user clicking an answer
        function handleAnswer(selectedSentence, buttonElement) {
            if (isWaitingForNext) return; // Prevent multiple clicks

            if (selectedSentence === currentCorrectAnswer.sentence) {
                // CORRECT
                playSound('correct');
                isWaitingForNext = true;
                score += 1;
                updateScore();
                
                // Visual feedback on button
                buttonElement.classList.remove(...buttonElement.className.split(' ').filter(c => c.startsWith('bg-') || c.startsWith('border-') || c.startsWith('shadow-')));
                buttonElement.classList.add('bg-green-500', 'border-green-600', 'shadow-[0_8px_0_0_#16a34a]');
                
                // Message feedback
                feedbackText.textContent = "Correct! Great Job! 🎉";
                feedbackText.className = "text-5xl md:text-6xl font-black text-green-500 drop-shadow-md transition-opacity duration-300";
                feedbackText.style.opacity = '1';

                setTimeout(generateQuestion, 1500);
            } else {
                // INCORRECT
                playSound('wrong');
                buttonElement.classList.add('animate-pulse');
                setTimeout(() => buttonElement.classList.remove('animate-pulse'), 500);

                feedbackText.textContent = "Try again! 🤔";
                feedbackText.className = "text-5xl md:text-6xl font-black text-rose-500 drop-shadow-md transition-opacity duration-300";
                feedbackText.style.opacity = '1';
                
                // Dim the wrong button slightly
                buttonElement.style.opacity = '0.5';
                buttonElement.onclick = null; // Disable this specific wrong button
                
                // Hide message after a bit so they can try again without distraction
                setTimeout(() => {
                    if(!isWaitingForNext) feedbackText.style.opacity = '0';
                }, 1500);
            }
        }

        function updateScore() {
            scoreDisplay.textContent = score;
            // Little bounce animation on score change
            scoreDisplay.parentElement.classList.remove('pop-in');
            void scoreDisplay.parentElement.offsetWidth;
            scoreDisplay.parentElement.classList.add('pop-in');
        }
    </script>
</body>
</html>

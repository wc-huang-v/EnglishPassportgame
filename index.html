<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語護照複習遊戲</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #fce4ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            color: #d81b60;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 80%;
            max-width: 600px;
        }
        .menu-btn {
            background-color: #fff;
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            padding: 1.5rem;
            border: 4px solid #ff4081;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 0 #c2185b;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .menu-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #c2185b;
        }
        .menu-btn.disabled {
            background-color: #e0e0e0;
            border-color: #9e9e9e;
            box-shadow: 0 8px 0 #757575;
            color: #757575;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>🌟 English Games 🌟</h1>
    
    <div class="menu-container">
        <!-- 連結到動物遊戲檔案 -->
        <a href="animals.html" class="menu-btn">🐘 1. Animals (W8~9)</a>

        <button class="menu-btn disabled" onclick="alert('Coming soon! 敬請期待！')">👮 3. Jobs (W12~13)</button>
        <button class="menu-btn disabled" onclick="alert('Coming soon! 敬請期待！')">🌳 4. Nature (W14)</button>
    </div>

</body>
</html>
